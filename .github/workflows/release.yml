# Builds an APK in the flake's devShell, signs it, and publishes it as a
# GitHub release whenever a tag like v1.2.3 is pushed. Started by hand, it
# only builds and tests.
#
# The three jobs keep the release key away from the build: Gradle and the
# plugins it downloads run without secrets or write access, signing runs
# no Gradle at all, and only publishing may write to the repository. The
# signing key comes from secrets of the "release" environment, which
# should only admit v* tags; scripts/release-key.nu creates it. Actions are
# pinned by commit, with the version they had in a comment.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - id: version
        # A tag names the version; a run by hand builds 0.0.1, the lowest
        # whose version code Android accepts.
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version=0.0.1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test, unsigned
        run: nix develop --command gradle --no-daemon testDebugUnitTest assembleRelease -Phexboard.version="${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  sign:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    environment: release
    steps:
      # Only for the devShell's pinned apksigner; nothing from Maven runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.HEXBOARD_KEYSTORE_BASE64 }}
          HEXBOARD_KEYSTORE_PASSWORD: ${{ secrets.HEXBOARD_KEYSTORE_PASSWORD }}
          HEXBOARD_KEY_ALIAS: ${{ secrets.HEXBOARD_KEY_ALIAS }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$HEXBOARD_KEYSTORE_PASSWORD" ]; then
            echo "::error::Signing secrets are missing; see scripts/release-key.nu"
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          nix develop --command sh -c '
            set -e
            tools=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
            "$tools/apksigner" sign --ks "$1" --ks-pass env:HEXBOARD_KEYSTORE_PASSWORD \
              --ks-key-alias "${HEXBOARD_KEY_ALIAS:-hexboard}" --out "$2" app-release-unsigned.apk
            "$tools/apksigner" verify --print-certs "$2"
          ' sign "$keystore" "hexboard-$VERSION.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: hexboard-${{ needs.build.outputs.version }}.apk
          if-no-files-found: error

  publish:
    needs: [build, sign]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" "hexboard-$VERSION.apk" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
