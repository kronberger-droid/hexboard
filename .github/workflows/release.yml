# Builds a signed APK in the flake's devShell and publishes it as a GitHub
# release whenever a tag like v1.2.3 is pushed. The signing key comes from
# repository secrets; scripts/release-key.nu creates it. Started by hand,
# it builds and checks the same way but publishes nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Pinned rather than ubuntu-latest, so a runner change is our commit.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Build and test
        env:
          KEYSTORE_BASE64: ${{ secrets.HEXBOARD_KEYSTORE_BASE64 }}
          HEXBOARD_KEYSTORE_PASSWORD: ${{ secrets.HEXBOARD_KEYSTORE_PASSWORD }}
          HEXBOARD_KEY_ALIAS: ${{ secrets.HEXBOARD_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$HEXBOARD_KEYSTORE_PASSWORD" ]; then
            echo "::error::Signing secrets are missing; see scripts/release-key.nu"
            exit 1
          fi
          # A tag names the version; a run by hand builds 0.0.0.
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version=0.0.0; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          export HEXBOARD_KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$HEXBOARD_KEYSTORE"
          nix develop --command gradle --no-daemon testDebugUnitTest assembleRelease -Phexboard.version="$version"
          cp app/build/outputs/apk/release/app-release.apk "hexboard-$version.apk"
          nix develop --command sh -c '"$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$0"' "hexboard-$version.apk"
          rm -f "$HEXBOARD_KEYSTORE"

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "hexboard-$VERSION.apk" --title "$GITHUB_REF_NAME" --generate-notes
